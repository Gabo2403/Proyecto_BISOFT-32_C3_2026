# Dirección base de la aplicación bajo prueba
urlBase=https://www.saucedemo.com
# Navegador: chrome | firefox | edge   (se puede sobrescribir: mvn test -Dnavegador=firefox)
navegador=chrome
# true para correr sin abrir ventana (mvn test -Dheadless=true)
headless=false
# Tiempo máximo de las esperas explícitas, en segundos
esperaSegundos=10
